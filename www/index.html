<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF4E4" />
    <meta name="description" content="A calm Christian lesson app for little ones." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manna & Milk" />
    <title>Manna & Milk</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="app.css" />
    <script>
      (function () {
        var dark = false;
        try {
          var saved = JSON.parse(localStorage.getItem("sunny-abc-v1") || "{}");
          var mode = saved.theme || "auto";
          dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (err) {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1b2430" : "#FFF4E4");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px">Manna & Milk needs JavaScript turned on.</p>
    </noscript>
    <script src="voice-map.js"></script>
    <script src="app.js"></script>
  </body>
</html>
