plugins {
    id "com.android.application"
}

android {
    namespace "app.sunnyabc"
    compileSdk 35

    defaultConfig {
        applicationId "app.sunnyabc"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "0.1.16-beta"
    }

    signingConfigs {
        release {
            def store = System.getenv("SUNNY_STORE_FILE")
            if (store) {
                storeFile file(store)
                storePassword System.getenv("SUNNY_STORE_PASSWORD")
                keyAlias System.getenv("SUNNY_KEY_ALIAS")
                keyPassword System.getenv("SUNNY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
    }
}

tasks.register("copyWeb", Copy) {
    from("${rootDir}/www")
    into("src/main/assets/www")
}

preBuild.dependsOn tasks.named("copyWeb")
